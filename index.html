<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philosophy with Omar | اختبارات الفلسفة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Philosophy with Omar</h1>
    <p>اختبارات الفلسفة · البكالوريا الأدبي</p>
  </header>

  <div class="container">
    <!-- شاشة البداية -->
    <div id="start-screen" class="card">
      <div class="empty-state">
        <h2>مرحباً بك</h2>
        <p id="questions-count">جاري تحميل الأسئلة...</p>
        <br>
        <button id="start-btn" class="btn btn-primary btn-block" style="display:none;">
          ابدأ الاختبار
        </button>
      </div>
    </div>

    <!-- شاشة السؤال -->
    <div id="quiz-screen" class="card" style="display:none;">
      <div class="progress-container">
        <div class="progress-info">
          <span id="question-counter">السؤال 1 من 10</span>
          <span id="score-live">النقاط: 0</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <div id="question-text" class="question-text"></div>

      <div id="options" class="options"></div>

      <div id="feedback" class="feedback"></div>

      <div class="actions">
        <button id="next-btn" class="btn btn-primary btn-block" style="display:none;">
          السؤال التالي
        </button>
      </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="card result-screen" style="display:none;">
      <h2>انتهى الاختبار</h2>
      <div id="final-score" class="result-score">0/0</div>
      <div id="result-message" class="result-message"></div>
      <div class="actions" style="justify-content: center;">
        <button id="restart-btn" class="btn btn-primary">إعادة الاختبار</button>
      </div>
    </div>
  </div>

  <footer>
    <p>
      <a href="admin.html">لوحة الإدارة</a>
    </p>
  </footer>

  <script src="quiz.js"></script>
</body>
</html>
